# Configuración de pytest — VisiSize
#
# Ejecutar toda la suite:      python -m pytest
# Solo un módulo:              python -m pytest tests/test_packing.py
# Con detalle de cada prueba:  python -m pytest -v
# Cobertura de un módulo:      python -m pytest tests/test_geometry.py --cov=core.geometry

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `conftest.py` está en tests/ y el proyecto está en la raíz; sin esto, pytest
# no encuentra `core`, `services`, `data` ni el propio `conftest` al importar.
pythonpath = . tests

addopts = --tb=short
filterwarnings =
    ignore::DeprecationWarning
